<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>testforge_AI Demo Checkout</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f5f9;color:#202235;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:white;padding:32px;border-radius:18px;box-shadow:0 10px 35px #17203312;width:min(440px,calc(100% - 48px))}
    button{border:0;border-radius:9px;padding:13px 18px;background:#6657e8;color:white;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
    .secondary{background:#e8e7ff;color:#30258a}.muted{color:#696b7b;font-size:14px}
    [data-testid="checkout-success"],[data-testid="checkout-error"]{margin-top:20px;padding:14px;border-radius:8px}
    [data-testid="checkout-success"]{background:#e6f8ed;color:#176638}
    [data-testid="checkout-error"]{background:#fff0ed;color:#a52b1b}
  </style>
</head>
<body>
<main>
  <p class="muted">testforge_AI · LOCAL DEMO</p>
  <h1>Checkout</h1>
  <p>Order #HT-1042 · Demo total: $49.00</p>
  <p class="muted">This page intentionally uses a changed button name and selector.</p>
  <div id="actions"></div>
  <div id="outcome" aria-live="polite"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const scenario = params.get("scenario") || "healable";
  const actions = document.querySelector("#actions");
  if (scenario === "ambiguous") {
    actions.innerHTML = '<button>Continue to Payment</button><button class="secondary">Continue to Payment</button>';
  } else {
    actions.innerHTML = '<button id="continue-payment">Continue to Payment</button>';
  }
  actions.addEventListener("click", (event) => {
    if (event.target.tagName !== "BUTTON") return;
    const outcome = document.querySelector("#outcome");
    if (scenario === "app-failure") {
      outcome.innerHTML = '<div data-testid="checkout-error">Payment service unavailable (HTTP 500). Please try again later.</div>';
    } else if (scenario === "ambiguous") {
      // A robust healing engine should ask for review before choosing either button.
      outcome.innerHTML = '<div class="muted">A button was clicked. The backend should not guess when candidates are ambiguous.</div>';
    } else {
      outcome.innerHTML = '<div data-testid="checkout-success">Order confirmed! Checkout completed successfully.</div>';
    }
  });
</script>
</body>
</html>
